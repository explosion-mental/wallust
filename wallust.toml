# global space #

# threshold: the less this is, the more precision the colors would be, and the longer it
# would take, below a little table.
threshold = 20.0
# <= 1.0 	Not perceptible by human eyes.
# 1 - 2 	Perceptible through close observation.
# 2 - 10 	Perceptible at a glance.
# 11 - 49 	Colors are more similar than opposite
# 100		Colors are exact opposite

[[entry]] # An entry is just a config file you wish to apply `wallust` generated colors
# a relative path to a file where wallust.toml is (~/.config/wallust/)
template = "dunstrc"
# absolute path to the file to write the template (after templating)
path = "~/.config/dunst/dunstrc"

[[entry]]
template = "zathurarc"
path = "~/.config/zathura/zathurarc"

[[entry]]
template = "bars.glsl"
path = "~/.config/glava/bars.glsl"
