# global space #

# How to parse the image:
# * full - reads the whole image (more precision)
# * resized - resizes the image before parsing it (more color mixing, faster)
# * wal - uses image magick `convert` to read the image
backend = "full"

# How would the palette created be.
# * dark - dark colors
filter = "dark"

# What color space to use to differentiate and select the scheme.
# * lab - use CIEL*a*b color space
color_space = "lab"

# Difference between similar colors:
#  <= 1       Not perceptible by human eyes.
#  1 - 2      Perceptible through close observation.
#  2 - 10     Perceptible at a glance.
#  11 - 49    Colors are more similar than opposite
#  100        Colors are exact opposite
threshold = 11

# An entry is just a config file you wish to apply `wallust` generated colors
[[entry]]
# a relative path to a file where wallust.toml is (~/.config/wallust/)
template = "dunstrc"

# absolute path to the file to write the template (after templating)
target = "~/.config/dunst/dunstrc"

[[entry]]
template = "zathurarc"
target = "~/.config/zathura/zathurarc"

[[entry]]
template = "bars.glsl"
target = "~/.config/glava/bars.glsl"
