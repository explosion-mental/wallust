[package]
name = "wallust"
version = "2.10.0-dev"
edition = "2021"
license = "MIT"
authors = [ "explosion-mental" ]
keywords = [ "cli", "template", "colorscheme", "theme" ]
categories = [ "command-line-utilities" ]
description = "Generate a 16 color scheme based on an image."
repository = "https://codeberg.org/explosion-mental/wallust"
homepage = "https://codeberg.org/explosion-mental/wallust"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
image = "0.24"
lab = "0.11"
owo-colors = "4.0"
toml = "0.8"
serde_json = "1.0"
shellexpand = "3.1"
glob = "0.3"
new_string_template = "1.4"
spinners = "4.1"
dirs = "5.0"
itertools = "0.12"
fast_image_resize = "3.0"
num-traits = "0.2"
easy_color = "0.1"
far = "=0.2.1" # hardcoded in case my "hacky" way of utilizing it could be considered a "bug"
kmeans_colors = { version = "0.6.0", default-features = true }
palette = "0.7"
fancy-regex = "0.13"
regex = "1"

clap  = { version = "4.3", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }

# optionals
documented = { version = "0.3.0", optional = true }
fastrand  = { version = "2", optional = true }
strum = { version = "0.26", features = ["derive"], optional = true }
wallust_themes = { version = "1.0", optional = true }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
word_iter = "0.2.1"
clap_complete = "4.4"

[features]
default = [ "themes" ]

# include built-in themes (~130K) <https://codeberg.org/explosion-mental/wallust-themes>
themes = [ "dep:fastrand", "dep:wallust_themes" ]
makeconfig = [ "dep:documented", "dep:strum", "clap/cargo" ]

[[bench]]
name = "backends"
harness = false

[[bench]]
name = "colorspaces"
harness = false
