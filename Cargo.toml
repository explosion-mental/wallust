[package]
name = "wallust"
version = "2.7.0"
edition = "2021"
license = "MIT"
authors = [ "explosion-mental" ]
keywords = [ "cli", "template", "colorscheme", "theme" ]
categories = [ "command-line-utilities" ]
description = "Generate a 16 color scheme based on an image."
repository = "https://codeberg.org/explosion-mental/wallust"
homepage = "https://codeberg.org/explosion-mental/wallust"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
image = "0.24"
lab = "0.11"
owo-colors = "3.5"
toml = "0.8"
serde_json = "1.0"
shellexpand = "3.1"
glob = "0.3"
new_string_template = "1.4"
spinners = "4.1"
dirs = "5.0"
itertools = "0.11"
fast_image_resize = "2.7"
num-traits = "0.2"

rand  = { version = "0.8", optional = true }
clap  = { version = "4.3", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = [ "themes" ]
themes = [ "dep:rand" ] # include built-in themes at ./src/themes/colorschemes.rs (130K)

[[bench]]
name = "backends"
harness = false

[[bench]]
name = "colorspaces"
harness = false
