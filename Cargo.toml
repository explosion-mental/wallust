[package]
name = "wallust"
version = "3.0.0-alpha"
edition = "2021"
license = "MIT"
authors = [ "explosion-mental" ]
keywords = [ "cli", "template", "colorscheme", "theme" ]
categories = [ "command-line-utilities" ]
description = "Generate a 16 color scheme based on an image."
repository = "https://codeberg.org/explosion-mental/wallust"
homepage = "https://codeberg.org/explosion-mental/wallust"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
image = "0.24"
lab = "0.11"
owo-colors = "4.0"
toml = "0.8"
toml_edit = "0.22"
serde_json = "1.0"
shellexpand = "3.1"
glob = "0.3"
new_string_template = "1.4"
spinners = "4.1"
dirs = "5.0"
itertools = "0.12"
fast_image_resize = "3.0"
num-traits = "0.2"
easy_color = "0.1"
kmeans_colors = { version = "0.6.0", default-features = false, features = ["palette_color"] }
palette = { version = "0.7", default-features = false }
regex = "1.10"
minijinja = "1.0"

clap  = { version = "4.3", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }

# optionals
documented = { version = "0.3.0", optional = true }
fastrand  = { version = "2.0", optional = true }
strum = { version = "0.26", features = ["derive"], optional = true }
wallust_themes = { version = "1.0", optional = true }

[dev-dependencies]
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports"] }
word_iter = "0.2.1"
clap_complete = "4.4"
clap_mangen = "0.2"
clap  = { version = "4.3", features = ["derive", "cargo"] }

[build-dependencies]
wallust_themes = "1.0"

[features]
default = [ "themes" ]
# include built-in themes (~130K) <https://codeberg.org/explosion-mental/wallust-themes>
themes = [ "dep:fastrand", "dep:wallust_themes" ]

# build generated stuff, used for building man pages and completions
buildgen = [ "doc", "iter", "clap/cargo" ]
doc  = [ "dep:documented" ]
iter = [ "dep:strum" ]

[[bench]]
name = "backends"
harness = false
required-features = ["iter"]

[[bench]]
name = "colorspaces"
harness = false
required-features = ["iter"]

[profile.release]
incremental = false
strip = true
lto   = true # Seems to increase ~0.2 secs in speed..
